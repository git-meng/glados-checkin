name: GLaDOS 2026 Checkin

on:
  schedule:
    # 北京时间 9:30 (UTC 1:30)
    - cron: '30 1 * * *'
    # 北京时间 21:30 (UTC 13:30)
    - cron: '30 13 * * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [main]  # 推送时也触发，保持活跃

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Checkin
        id: checkin
        continue-on-error: true
        run: |
          status=0
          python checkin.py || status=$?
          if [ "$status" -eq 2 ]; then
            echo "requires_browser=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
        timeout-minutes: 5
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

      - name: Retry on Failure
        if: steps.checkin.outcome == 'failure' && steps.checkin.outputs.requires_browser != 'true'
        run: |
          echo "First attempt failed, retrying in 60s..."
          sleep 60
          python checkin.py
        timeout-minutes: 5
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

      - name: Report Required Browser Verification
        if: steps.checkin.outputs.requires_browser == 'true'
        run: |
          echo "::error::GLaDOS rejected the check-in at Cloudflare verification. Check today's points history on the official website."
          exit 1
